name: Build Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --name city_qes --onefile --windowed --distpath dist --workpath build --specpath spec --add-data "data;data" run.py

      - name: Upload to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.exe"
          tag: "build-${{ github.run_id }}"
          name: "Build ${{ github.run_id }}"
          body: "Auto-built executable from ${{ github.sha }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}